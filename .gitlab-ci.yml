# Linux uses the Qt 6 dependency image from KMyMoney's own CI.
# See README.md: GitLab CI and release packaging. Releases use native SDK runners.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: /.gitlab/release.yml

stages:
  - test
  - secret-detection
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  SECRET_DETECTION_ENABLED: 'true'
  AST_ENABLE_MR_PIPELINES: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection
  needs: []

plugins:linux:
  stage: test
  image:
    name: rhabacker/suse_leap_16_kf6_qt6@sha256:d8299f96dc3df7fba6e6688de06501d65b683fe18c59ab117e76ff5da191eca0
    entrypoint: ['']
    docker:
      platform: linux/amd64
  interruptible: true
  timeout: 2h
  variables:
    GIT_STRATEGY: clone
  # The upstream image does not supply pwsh. Only its bootstrap uses the runner shell.
  # Craft provisioning and the shared cross-platform build graph run in PowerShell.
  before_script:
    - zypper --non-interactive install curl tar gzip git ninja gcc-c++ make patch python3 python3-pip gettext-tools libicu libopenssl3 libunwind8 libuuid1 qt6-sql-sqlite
    - mkdir -p /tmp/powershell /opt/microsoft/powershell/7
    - curl --fail --location --retry 3 --output /tmp/powershell/powershell-7.6.6-linux-x64.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz
    - echo 'ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  /tmp/powershell/powershell-7.6.6-linux-x64.tar.gz' | sha256sum --check --strict -
    - tar -xzf /tmp/powershell/powershell-7.6.6-linux-x64.tar.gz -C /opt/microsoft/powershell/7
    - chmod +x /opt/microsoft/powershell/7/pwsh
  script:
    - /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File build.ps1 -Tasks CI -EnvFile env.ci.ini
  artifacts:
    name: 'plugins-linux-$CI_COMMIT_SHORT_SHA'
    when: always
    expire_in: 14 days
    paths:
      - stage/craft-linux/
      - build/ci/pester.xml
      - build/craft-linux/ctest-junit.xml
      - build/craft-linux/Testing/Temporary/LastTest.log
      - build/craft-linux/CMakeFiles/CMakeConfigureLog.yaml
      - build/ci/kmymoney-version.txt
    reports:
      junit:
        - build/ci/pester.xml
        - build/craft-linux/ctest-junit.xml
