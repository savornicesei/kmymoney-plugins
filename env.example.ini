# Copy to ignored env.ini, or run build.ps1 -Tasks FirstRun.
# Values are literal; no variable expansion or PowerShell expressions.
[Environment]
CRAFT_ROOT=
KMYMONEY_SOURCE_DIR=
KMYMONEY_EXECUTABLE=
CRAFT_PYTHON=
# CI overrides -Plugins with this comma-separated selection.
KMM_PLUGINS=all
# Use a version/tag or branch listed by: craft --search KMyMoney
# Copy its exact name, for example master; Craft decides which names are supported.
# Empty leaves the existing Craft version selection unchanged.
KMM_APP_VERSION=
# Optional existing host SDK paths; empty values allow CMake discovery.
KMYMONEY_SDK_SOURCE_DIR=
KMYMONEY_BUILD_DIR=
CMAKE_BUILD_PARALLEL_LEVEL=4
# Leave empty for desktop use; CI uses offscreen.
QT_QPA_PLATFORM=
LANG=
LC_ALL=
